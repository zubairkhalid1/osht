[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "osht"
version = "0.1.0"
description = "Spherical harmonic transforms on optimal-dimensionality (L^2) samples: O(L^3) interpolated elimination, exact inverse, stable ring placements"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Zubair Khalid", email = "zubair.khalid@lums.edu.pk" }]
maintainers = [{ name = "Zubair Khalid", email = "zubair.khalid@lums.edu.pk" }]
keywords = [
    "spherical harmonics",
    "spherical harmonic transform",
    "sampling on the sphere",
    "optimal dimensionality",
    "sampling theorem",
    "signal processing on the sphere",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.22",
    "scipy>=1.8",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.5"]
test = ["pytest>=7", "pytest-cov"]
docs = ["sphinx>=7", "furo", "numpydoc", "myst-parser", "matplotlib>=3.5"]
dev = ["osht[plot,test,docs]", "ruff", "build", "twine", "pre-commit"]

[project.urls]
Homepage = "https://github.com/zubairkhalid1/osht"
Documentation = "https://zubairkhalid1.github.io/osht"
Repository = "https://github.com/zubairkhalid1/osht"
Issues = "https://github.com/zubairkhalid1/osht/issues"
Changelog = "https://github.com/zubairkhalid1/osht/blob/main/CHANGELOG.md"
Paper = "https://arxiv.org/abs/2611.16441"

[tool.hatch.build.targets.wheel]
packages = ["src/osht"]

[tool.hatch.build.targets.sdist]
include = [
    "src/osht",
    "tests",
    "demos",
    "docs",
    "paper",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "CITATION.cff",
    "CONTRIBUTING.md",
]
exclude = ["docs/_build", "docs/generated"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error::DeprecationWarning:osht"]

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
ignore = ["E741", "B028"]

[tool.ruff.lint.per-file-ignores]
"demos/*" = ["E402"]
"paper/*" = ["E402"]
"docs/conf.py" = ["E402"]
"docs/make_readme_figures.py" = ["E402"]

[tool.coverage.run]
source = ["osht"]
